<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://xvacijpdfqccsigcoctg.supabase.co wss://xvacijpdfqccsigcoctg.supabase.co; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>one.solar · Solar Gators</title>
  <meta name="description" content="one.solar: every Solar Gators team app in one place — Orders, Sponsors, Finances, Solar Evals, GatorWire and more.">
  <link rel="icon" href="shared/assets/favicon.png">
  <link rel="apple-touch-icon" href="shared/assets/apple-touch-icon.png">
  <script src="shared/theme.js"></script>
  <link rel="stylesheet" href="shared/onesolar.css">
  <link rel="stylesheet" href="hub/hub.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="one.solar home">
        <img class="brand-logo" data-auto-logo src="shared/assets/solar-gators-logo.png" alt="Solar Gators" width="800" height="237">
        <span class="brand-divider" aria-hidden="true"></span>
        <span>one<span class="brand-accent">.solar</span></span>
      </a>
      <div class="topbar-end" id="account"></div>
    </div>
  </header>

  <div id="announcement" class="announcement" role="status" hidden></div>

  <main class="container">
    <section class="hero">
      <div class="hero-row">
        <div>
          <h1 id="hello">Welcome to one.solar</h1>
          <p id="lede"></p>
        </div>
        <button type="button" class="btn btn-sm" id="edit-open" hidden>✎ Edit home screen</button>
      </div>
      <div class="search-wrap" id="search-wrap" hidden>
        <label class="sr-only" for="search">Find an app</label>
        <input type="search" id="search" placeholder="Find an app…  ( / )" autocomplete="off" spellcheck="false">
      </div>
    </section>
    <p class="alert alert-success" id="waiting-done" role="status" hidden></p>
    <section class="card waiting" id="waiting" aria-label="Waiting to join the team" hidden></section>
    <section class="card welcome" id="welcome" aria-label="Welcome to the team" hidden></section>
    <div id="apps" aria-label="Apps"></div>
    <div class="more" id="more"></div>
  </main>

  <footer class="footer container">UF Solar Gators · One account for every app.</footer>

  <script type="module" src="hub/home.js"></script>
  <script>
    // If the page hasn't drawn after a few seconds (no connection, or a half-updated copy of the site
    // cached right after a new version went up), say so instead of showing a blank page.
    setTimeout(function () {
      if (document.body.classList.contains('ready')) return;
      document.getElementById('apps').innerHTML = '<div class="card"><strong>one.solar didn’t finish loading.</strong>'
        + '<p class="muted">Check your connection, then reload. Right after an update, a hard refresh helps: Ctrl + Shift + R (Mac: Cmd + Shift + R).</p>'
        + '<button type="button" class="btn btn-primary" onclick="location.reload()">Reload</button></div>';
      document.body.classList.add('ready');
    }, 6000);
  </script>
</body>
</html>
