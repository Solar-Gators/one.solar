<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneSolar · Solar Gators</title>
  <meta name="description" content="OneSolar: every Solar Gators team app in one place — Orders, Sponsors, Finances, Solar Evals, GatorWire and more.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script>
    // Light / dark before the page draws (same setting as the Order Form).
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/onesolar.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="OneSolar home">
      <img class="brand-logo" src="assets/solar-gators-logo.png" alt="Solar Gators">
      <span class="brand-name">One<b>Solar</b></span>
    </a>
    <div class="account">
      <button type="button" class="icon-btn" id="theme" aria-label="Switch light / dark">🌙</button>
      <span id="account"></span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-row">
        <div>
          <h1 id="hello">Welcome to OneSolar</h1>
          <p id="lede"></p>
        </div>
        <button type="button" class="btn btn-sm" id="customize-open" hidden>⚙ Customize cards</button>
      </div>
    </section>
    <section class="card customize" id="customize" hidden aria-label="Customize cards"></section>
    <section class="apps" id="apps" aria-label="Apps"></section>
    <div class="more" id="more"></div>
  </main>

  <footer>UF Solar Gators · One account for every app.</footer>

  <script type="module" src="js/home.js"></script>
</body>
</html>
